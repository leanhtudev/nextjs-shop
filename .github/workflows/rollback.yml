name: Rollback

# Manual, one-click rollback: point the ECS service at an earlier task definition revision.
# Every deploy registers a new revision, so revision N-1 is the previous release.
# Leave "revision" empty to list recent revisions in the run summary without changing anything.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Task definition revision number to roll back to (empty = list recent revisions)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production # shares the lock with cd.yml: never runs during a deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}

jobs:
  rollback:
    name: Roll back production
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production # same approval gate and role as a deploy
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate input
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [ -n "$REVISION" ] && ! [[ "$REVISION" =~ ^[0-9]+$ ]]; then
            echo "::error::revision must be a number, got '$REVISION'"; exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Recent revisions
        run: |
          current=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          {
            echo "### Currently running: \`${current##*/}\`"
            echo "| Revision | Image |"
            echo "| --- | --- |"
            for arn in $(aws ecs list-task-definitions --family-prefix "$ECS_TASK_FAMILY" --sort DESC \
                         --max-items 10 --query 'taskDefinitionArns[]' --output text); do
              image=$(aws ecs describe-task-definition --task-definition "$arn" \
                --query 'taskDefinition.containerDefinitions[0].image' --output text)
              echo "| ${arn##*:} | \`${image##*/}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back
        if: inputs.revision != ''
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          target="$ECS_TASK_FAMILY:$REVISION"
          aws ecs describe-task-definition --task-definition "$target" >/dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$target" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "### Rolled back to \`$target\`" >> "$GITHUB_STEP_SUMMARY"
