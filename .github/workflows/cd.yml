name: CD

# main → CI gate → build image ONCE (tag = git SHA) → approval → deploy to ECS → smoke test
#      → automatic rollback to the previous task definition if the smoke test fails.
#
# AWS jobs are skipped until the repository variable AWS_DEPLOY_ENABLED is "true",
# so this is safe to merge before the AWS account exists.
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**/*.md"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false # never cancel a deploy half-way

env:
  AWS_REGION: ${{ vars.AWS_REGION }} # PLACEHOLDER, e.g. eu-north-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }} # terraform output ecr_repository
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }} # terraform output ecs_cluster
  ECS_SERVICE: ${{ vars.ECS_SERVICE }} # terraform output ecs_service
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }} # terraform output ecs_task_family
  CONTAINER_NAME: app

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build + push image
    needs: ci
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC → AWS_BUILD_ROLE_ARN (ECR push only)
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }} # terraform output github_build_role_arn
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: image
        name: Image URI + does it already exist?
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$SHA" >> "$GITHUB_OUTPUT"
          # Tags are immutable: a re-run for the same commit reuses the image instead of failing the push.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push (once per commit)
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: DEPLOYMENT_VERSION=${{ github.sha }}
          # Same key for every build, so old and new tasks can decrypt each other's Server Actions mid-deploy.
          secrets: |
            server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          URI: ${{ steps.image.outputs.uri }}
          REUSED: ${{ steps.image.outputs.exists }}
        run: |
          echo "Image \`$URI\` (reused existing: $REUSED)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production # protected: required reviewers + main only (repo settings)
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write # OIDC → AWS_DEPLOY_ROLE_ARN (ECS rollout only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }} # terraform output github_deploy_role_arn
          aws-region: ${{ env.AWS_REGION }}

      - name: Remember the running task definition (rollback target)
        id: previous
        run: |
          arn=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Previous task definition: \`$arn\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.ECS_TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}
          environment-variables: |
            DEPLOYMENT_VERSION=${{ github.sha }}

      - name: Deploy (rolling; ECS circuit breaker rolls back if tasks fail to start)
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Setup for smoke tests
        if: vars.APP_URL != ''
        uses: ./.github/actions/setup

      - name: Smoke test the live site (read-only @smoke specs)
        id: smoke
        if: vars.APP_URL != ''
        env:
          BASE_URL: ${{ vars.APP_URL }}
          EXPECTED_VERSION: ${{ github.sha }} # fails if the old version is still serving
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke

      - name: Roll back to the previous task definition
        if: failure() && steps.deploy.outcome == 'success' && steps.previous.outputs.arn != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.arn }}
        run: |
          echo "::error::Smoke test failed, rolling back to $PREVIOUS"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "### Rolled back to \`$PREVIOUS\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success()
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::7}\` to production"
            echo "- Image: \`$IMAGE\`"
            echo "- Task definition: \`$TASK_DEF\`"
          } >> "$GITHUB_STEP_SUMMARY"
